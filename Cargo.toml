#notice: if you are in rust non-nightly version try #the "cargo-features" and change panic to panic = "abort" 
cargo-features = ["panic-immediate-abort"]
[workspace]
resolver = "2"
members = [
    "crates/n3ri-core",
    "crates/n3ri-llm",
    "crates/n3ri-agent",
    "crates/n3ri-ui",
    "crates/n3ri-live2d",
    # "crates/n3ri-render",
    # "crates/n3ri-audio",
    # "crates/n3ri-apps",
    "examples/minimal",
]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_ui_render"] }
bevy_tweening = "0.16"
chrono = "0.4"
# To avoid eprintln("ICU4X data error: No segmentation model for complex script: Chinese/Japanese")
icu_provider = { version = "2", features = ["logging"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Release size/performance tuning
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "immediate-abort"
debug = 0

[profile.release.package."*"]
opt-level = 3

# ── Servo 浏览器引擎补丁（移植自 refer/wgpu-graft，仅在引入 servo 后生效）──
#
# glslopt 0.1.12（webrender 拉入）自带 C11 threads 兼容头，其
# `typedef pthread_once_t once_flag;` 与 glibc 2.34+ <stdlib.h> 的 once_flag 冲突；
# 0.1.14 加了 `#ifndef __once_flag_defined` 保护。servo 未升级前在此覆盖，
# 否则 Fedora 40+ / Ubuntu 24.04+ 编译 Servo 失败。
[patch.crates-io]
glslopt = { git = "https://github.com/jamienicol/glslopt-rs", rev = "68019f02a1437d785408ebc8ce7fd20341fffb8a" }
