<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>n3ri_os 浏览器 · 起始页</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #0b1a2a, #10243a 60%, #0d2030);
    color: #d8e8f0;
    font-family: "Sarasa Mono SC", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  .card {
    width: min(560px, 86vw);
    padding: 32px 36px;
    border-radius: 14px;
    background: rgba(16, 30, 46, 0.72);
    border: 1px solid rgba(120, 200, 230, 0.18);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
  }
  h1 { margin: 0 0 8px; font-size: 26px; color: #8fd8ee; }
  p  { margin: 6px 0; line-height: 1.7; color: #b8ccd8; }
  code {
    display: inline-block; padding: 1px 8px; border-radius: 5px;
    background: rgba(120, 200, 230, 0.14); color: #7fe0ff;
  }
  .links { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  a {
    color: #0a1a26; text-decoration: none; padding: 7px 14px; border-radius: 7px;
    background: #5fc3e8; font-weight: 600; font-size: 14px;
  }
  a:hover { background: #8fd8f5; }
</style>
</head>
<body>
  <main class="card">
    <h1>n3ri_os 浏览器</h1>
    <p>这是内置的起始页。地址栏输入网址后回车即可访问互联网页面。</p>
    <p>引擎为嵌入式 <b>Servo</b>（wgpu-graft / CPU readback 路径），窗口由桌面壳接管：可拖拽、缩放、最小化。</p>
    <div class="links">
      <a href="https://www.bing.com">Bing 搜索</a>
      <a href="https://example.com">example.com</a>
      <a href="https://servo.org">Servo 官网</a>
    </div>
  </main>
</body>
</html>
