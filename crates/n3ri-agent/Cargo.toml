[package]
name = "n3ri-agent"
version = "0.1.0"
edition = "2021"
description = "Nori 聊天智能体运行时：上下文快照、定时钩子、冷温热记忆、niri 特化 tools"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_state",
] }
n3ri-core = { path = "../n3ri-core" }
n3ri-llm = { path = "../n3ri-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { workspace = true }
dirs = "5"
