[package]
name = "n3ri-live2d"
version = "0.1.0"
edition = "2021"
description = "Live2D desktop pet for n3ri_os (Cubism v3 via mocari pure-Rust runtime)"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_window",
    "ktx2",
    "basis-universal",
    "zstd_rust",
] }
mocari = { version = "0.4.0", default-features = false }
bevy_tweening = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
embed-model = []

[dev-dependencies]
bevy_asset = "0.19"
bevy_image = { version = "0.19", features = ["ktx2", "basis-universal", "zstd_rust"] }

[[example]]
name = "mocari_probe"
path = "examples/mocari_probe.rs"

[[example]]
name = "smoke"
path = "examples/smoke.rs"
