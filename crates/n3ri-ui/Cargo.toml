[package]
name = "n3ri-ui"
version = "0.1.0"
edition = "2021"
description = "UI components for n3ri_os"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_ui_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_asset",
    "default_font",
    "png",
    "jpeg",
] }
n3ri-core = { path = "../n3ri-core" }
n3ri-llm = { path = "../n3ri-llm" }
portable-pty = "0.8"
bevy_woff = "0.2"
# 壁纸桥接：读取 layer-shell 指针状态/表面信息（vendored，本地补丁增加 axis 滚动捕获）
bevy_live_wallpaper = { path = "../../vendor/bevy_live_wallpaper", default-features = false, features = ["wayland"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chrono = { workspace = true }
icu_provider = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.2"

# ── 浏览器（Servo 嵌入，Linux CPU readback 路径）──
servo = { git = "https://github.com/servo/servo", branch = "release/v0.5", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
# wgpu-graft 适配器（path 直连 refer/，内部 path 依赖 ../grafting，均保持 MPL-2.0 头部）
servo-wgpu-interop-adapter = { path = "../../refer/wgpu-graft/servo-wgpu-interop-adapter", features = ["servo"] }
rustls = "0.23"
url = "2"
euclid = "0.22.11"
pollster = "0.4"
# 直接使用 wgpu/winit 类型（与 bevy 0.19 / refer 适配器统一版本）
wgpu = "29"
winit = "0.30"

[features]
embed-content = []
