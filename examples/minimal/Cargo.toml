[package]
name = "n3ri-minimal"
version = "0.1.0"
edition = "2021"
description = "Minimal example for n3ri_os"

[[bin]]
name = "n3ri-minimal"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "bevy_window",
    "multi_threaded",
    "default_font",
    "png",
    "vorbis",
    "mp3",
    "flac",
    "wav",
    "aac",
    "mp4",
    "x11",
    "wayland",
] }
n3ri-core = { path = "../../crates/n3ri-core" }
n3ri-ui = { path = "../../crates/n3ri-ui" }
n3ri-agent = { path = "../../crates/n3ri-agent" }
n3ri-live2d = { path = "../../crates/n3ri-live2d" }
lofty = "0.22"
# 壁纸模式：layer-shell 壁纸 surface + 全局指针卫星（XQueryPointer 轮询，触摸板/鼠标通吃）
# vendored：本地补丁增加 wl_pointer.axis 滚动事件捕获（0.5.0 是最新版本，上游不处理 Axis）
bevy_live_wallpaper = { path = "../../vendor/bevy_live_wallpaper", default-features = false, features = ["wayland"] }
x11rb = { version = "0.13" }
bevy_embedded_assets = { version = "0.16", optional = true }

[features]
embed-assets = ["dep:bevy_embedded_assets", "n3ri-live2d/embed-model", "n3ri-ui/embed-content"]
profiling = ["bevy/sysinfo_plugin"]
