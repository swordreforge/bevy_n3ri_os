[package]
name = "demo-servo-bevy"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Demo embedding Servo in a Bevy app, zero-copy via D3D12 shared-handle import into a GpuImage"

[dependencies]
demo-support = { path = "../demo-support" }
euclid = "0.22.11"
# Bevy 0.19 is on wgpu 29 (the 0.18 line was wgpu 27), so the imported texture
# stays Bevy's own wgpu::Texture type with no new grafting wgpu version.
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_sprite",
    # Bevy 0.19 split sprite drawing out of `bevy_sprite`: the SpriteRenderPlugin
    # (which actually renders sprites) lives behind `bevy_sprite_render`.
    "bevy_sprite_render",
    # UI + text for the URL bar chrome. `bevy_ui_render` draws the UI pass and
    # `default_font` embeds the FiraMono font that `TextFont::default()` resolves to.
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    # OS clipboard (arboard) for copy/paste in the URL bar. Without this,
    # `bevy_text`'s ClipboardPlugin only provides an in-process buffer.
    "system_clipboard",
    "bevy_window",
    "bevy_asset",
    "x11",
] }
# servo without `clipboard` (the page-level arboard delegate). The URL bar's
# own copy/paste uses bevy's `system_clipboard` feature, so this only drops
# `navigator.clipboard` on the web-content side. `js_jit` must stay: it keeps
# mozjs on its prebuilt-archive path and enables the JS JIT.
servo = { git = "https://github.com/servo/servo", branch = "release/v0.5",
          default-features = false,
          features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
rustls = "0.23.37"
pollster = "0.4.0"
grafting = { path = "../grafting" }
servo-wgpu-interop-adapter = { path = "../servo-wgpu-interop-adapter", features = ["servo"] }
url = "2.5.7"
winit = "0.30.13"
wgpu = { version = "29.0.1", features = ["metal"] }
